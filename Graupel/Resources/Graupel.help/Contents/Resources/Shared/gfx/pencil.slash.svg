<?xml version="1.0" encoding="UTF-8"?>
<!-- Graupel Help: the status bar's "not editable" pencil with a slash -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
<style>
    .symbol { fill: black; stroke: black; }
    @media (prefers-color-scheme: dark) { .symbol { fill: white; stroke: white; } }
</style>
<defs>
  <mask id="gap">
    <rect fill="white" width="72" height="72"/>
    <line x1="9" y1="9" x2="63" y2="63" stroke="black" stroke-width="15" stroke-linecap="round"/>
  </mask>
</defs>
<g class="symbol">
  <g mask="url(#gap)" stroke="none">
    <g transform="rotate(-45 36 36)">
      <path d="M17 27 H49 V45 H17 L2 36 Z"/>
      <rect x="52" y="27" width="16" height="18" rx="4.5"/>
    </g>
  </g>
  <line x1="9" y1="9" x2="63" y2="63" fill="none" stroke-width="6.5" stroke-linecap="round"/>
</g>
</svg>
