name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub's Xcode 27 image (in preview); match the Xcode used for releases.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app

jobs:
  packages:
    name: ${{ matrix.package }} tests
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [EditorCore, MacUI, Syntax]
    steps:
      - uses: actions/checkout@v7
      - name: Show versions
        run: |
          sw_vers
          xcodebuild -version
      - name: Test
        run: swift test --package-path Packages/${{ matrix.package }}

  app:
    name: App tests
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Show versions
        run: |
          sw_vers
          xcodebuild -version
      # The default build signs ad hoc (Configurations/CodeSigning-AdHoc.xcconfig), so no certificate is needed.
      - name: Test
        run: |
          xcodebuild test \
            -project Graupel.xcodeproj -scheme Graupel -configuration Debug \
            -testPlan Tests -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation
      - name: Build and launch a Release build
        run: |
          set -eu
          xcodebuild build \
            -project Graupel.xcodeproj -scheme Graupel -configuration Release \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            > release-build.log 2>&1 || { tail -40 release-build.log; exit 1; }
          app=build/Build/Products/Release/Graupel.app
          "$app/Contents/MacOS/Graupel" > /dev/null 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2> /dev/null; then
            echo "Graupel quit within 10 seconds of launching" >&2
            exit 1
          fi
          kill "$pid"

  help:
    name: Help check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the Help book
        run: python3 Scripts/checkHelp.py
